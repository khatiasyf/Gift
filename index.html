<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A surprise for you 🎁</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #2b1f4a, #120c22);
    color: #fff; overflow: hidden; text-align: center; padding: 24px;
  }
  .hint { font-size: 18px; opacity: .85; margin-bottom: 36px; animation: pulse 1.8s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .box { position: relative; width: 180px; height: 170px; cursor: pointer; animation: wiggle 2.5s infinite; }
  @keyframes wiggle { 0%,80%,100% { transform: rotate(0); } 84% { transform: rotate(-6deg); } 88% { transform: rotate(6deg); } 92% { transform: rotate(-4deg); } 96% { transform: rotate(3deg); } }
  .base { position: absolute; bottom: 0; left: 10px; width: 160px; height: 120px; background: #e84a6f; border-radius: 6px; }
  .lid { position: absolute; top: 18px; left: 0; width: 180px; height: 38px; background: #ff5c85; border-radius: 6px; transition: transform .7s cubic-bezier(.3,1.6,.6,1), opacity .7s; z-index: 2; }
  .ribbon-v { position: absolute; left: 50%; transform: translateX(-50%); width: 26px; height: 100%; background: #ffd34d; }
  .bow { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 40px; line-height: 1; }
  .opened .lid { transform: translateY(-160px) rotate(-30deg); opacity: 0; }
  .opened { animation: none; }
  .msg {
    position: absolute; max-width: 420px; padding: 28px 26px; border-radius: 18px;
    background: #fff; color: #2b1f4a; font-size: 22px; line-height: 1.45; font-weight: 600;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    opacity: 0; transform: scale(.3) translateY(60px); pointer-events: none;
    transition: all .6s cubic-bezier(.3,1.4,.6,1) .35s;
  }
  .msg.show { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
  .msg small { display: block; margin-top: 14px; font-size: 15px; font-weight: 400; opacity: .7; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
  <p class="hint" id="hint">Tap the box to open 👇</p>
  <div class="box" id="box" role="button" aria-label="Open the gift">
    <div class="base"><div class="ribbon-v"></div></div>
    <div class="lid"><div class="ribbon-v"></div><div class="bow">🎀</div></div>
  </div>
  <div class="msg" id="msg">
    Surprise! 🎉<br>Thank you for being amazing — this one's for you!
    <small>— Khatia</small>
  </div>
<script>
  const box = document.getElementById('box');
  box.addEventListener('click', () => {
    if (box.classList.contains('opened')) return;
    box.classList.add('opened');
    document.getElementById('hint').style.visibility = 'hidden';
    setTimeout(() => { box.style.transition = 'opacity .4s'; box.style.opacity = '0'; }, 500);
    document.getElementById('msg').classList.add('show');
    const colors = ['#ffd34d','#ff5c85','#5ce1e6','#9b7bff','#7dff9b'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * .6) + 's';
      document.body.appendChild(c);
    }
  });
</script>
</body>
</html>
